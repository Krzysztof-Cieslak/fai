name: Rust build cache
description: Restore dependency artifacts from the populated-cache namespace and report reuse.
inputs:
  shared-key:
    description: Build lane sharing compatible dependency artifacts.
    required: true
outputs:
  cache-hit:
    description: Whether an exact dependency cache was restored.
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: Swatinem/rust-cache@v2
      id: restore
      with:
        prefix-key: fai-rust-v1
        shared-key: ${{ inputs.shared-key }}
        cache-bin: false
    - name: Report restored Rust artifacts
      shell: python
      env:
        RUST_CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
      run: |
        import os, subprocess, sys
        subprocess.run([sys.executable, "scripts/ci_rust.py", "cache", "--stage", "restored", "--hit", os.environ["RUST_CACHE_HIT"]], check=True)

name: Benchmarks

# Wall-clock benchmarks are informational, never a pass/fail gate (shared runners
# are noisy — performance is gated by the deterministic guard tests in the `CI`
# workflow). Optional runs are manual-only and the workflow is disabled in the
# repository settings. When explicitly enabled and dispatched, it publishes the
# benchmark report and raw results without competing with automatic merge checks.
on:
  workflow_dispatch:

# Serialize intentional manual reports without cancelling an in-flight report.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  bench:
    name: performance benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned toolchain
        run: |
          cargo --version
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Install pinned OCaml with Flambda
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "ocaml-variants.5.5.1+options,ocaml-option-flambda"
          opam-pin: false

      - name: Verify and record benchmark toolchains
        run: |
          mkdir -p target
          compiler="$(opam var bin)/ocamlopt"
          test "$("$compiler" -version)" = "5.5.1"
          test "$("$compiler" -config-var flambda)" = "true"
          "$compiler" -config > target/ocaml-config.txt
          printf 'FAI_BENCH_OCAMLOPT=%s\n' "$compiler" >> "$GITHUB_ENV"
          printf '%s -O3 baseline.ml -o baseline\n' "$compiler" > target/ocaml-command.txt
          printf 'OCAMLPARAM=%s\nOCAMLRUNPARAM=%s\n' "${OCAMLPARAM-}" "${OCAMLRUNPARAM-}" > target/ocaml-environment.txt
          rustc -Vv > target/rustc-version.txt

      - name: Run benchmarks
        # `DIVAN_MAX_TIME` caps the wall time per benchmarked function. A
        # manual run uses a generous cap (120s):
        # enough for the process-spawn benches (algorithms_aot, the daemon e2e at
        # 200 modules, the fai test loop) to reach divan's full ~100-sample target
        # for steadier medians, while still bounding any pathological function.
        # `pipefail` surfaces a benchmark that actually crashes or whose result
        # diverges from its oracle (a bug, not a perf regression) while still
        # capturing the output rendered below.
        env:
          DIVAN_MAX_TIME: '120'
          # The warm AOT sampler retains its own paired raw batches and floors.
          FAI_BENCH_ARTIFACT_DIR: target/bench-native
        run: |
          set -o pipefail
          mkdir -p target
          opam exec -- cargo bench --workspace --benches --locked 2>&1 | tee target/bench-output.txt

      - name: Render report
        if: always()
        # Appends a Markdown report to the run summary ($GITHUB_STEP_SUMMARY) and
        # writes the parsed JSON artifact. Reads GITHUB_SERVER_URL/REPOSITORY/SHA
        # to link real-world rows to their source line. Never fails the build.
        run: cargo run -q -p fai-tests --bin bench-summary -- target/bench-output.txt target/bench-results.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            target/bench-output.txt
            target/bench-results.json
            target/ocaml-config.txt
            target/ocaml-command.txt
            target/ocaml-environment.txt
            target/rustc-version.txt
            target/bench-native/
          if-no-files-found: ignore

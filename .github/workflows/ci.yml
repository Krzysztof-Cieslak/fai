name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      force_full:
        type: boolean
        default: true

concurrency:
  group: ci-${{ inputs.source_sha || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    outputs:
      compiler: ${{ steps.scope.outputs.compiler }}
      reporting: ${{ steps.scope.outputs.reporting }}
      packages: ${{ steps.scope.outputs.packages }}
      package_names: ${{ steps.scope.outputs.package_names }}
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compare with the actual base, including stacked PRs
        id: scope
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci.py scope --github-output ${{ inputs.force_full && '--force-full' || '' }}
      - name: Require compiler, tooling, and standard-library changelog entries
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/release.py check-changelog

  # Keep the four branch-protection check names. Each runs even when selection
  # fails, so a failed classifier cannot turn required checks into skipped greens.
  # Cancellation still stops superseded runs and releases their concurrency slot.
  lint:
    name: fmt + clippy
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      SCOPE_RESULT: ${{ needs.changes.result }}
      CI_MODE: ${{ needs.changes.outputs.mode }}
      CI_COMPILER: ${{ needs.changes.outputs.compiler }}
      CI_REPORTING: ${{ needs.changes.outputs.reporting }}
      CI_PACKAGES: ${{ needs.changes.outputs.packages }}
      PACKAGE_NAMES: ${{ needs.changes.outputs.package_names }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Require successful change classification
        run: python scripts/ci.py require
      - name: Tooling tests
        if: needs.changes.outputs.compiler == 'true'
        run: python -m unittest discover -s scripts/tests -v
      - name: Report presentation syntax
        if: needs.changes.outputs.reporting == 'true'
        run: python -m compileall -q scripts/performance_report
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.compiler == 'true'
      - name: Rust format
        if: needs.changes.outputs.compiler == 'true'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: needs.changes.outputs.compiler == 'true'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - uses: ./.github/actions/compiler
        if: needs.changes.outputs.mode == 'packages'
      - name: Validate locked package workspace
        if: needs.changes.outputs.mode == 'packages'
        run: python scripts/ci.py validate-packages
      - name: Package formatting
        if: needs.changes.outputs.compiler != 'true' && needs.changes.outputs.packages != '[]'
        run: |
          for package in $PACKAGE_NAMES; do
            fai fmt --check --locked -C packages --package "$package"
          done

  unit:
    name: unit + e2e tests (linux)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      SCOPE_RESULT: ${{ needs.changes.result }}
      CI_MODE: ${{ needs.changes.outputs.mode }}
      CI_COMPILER: ${{ needs.changes.outputs.compiler }}
      CI_REPORTING: ${{ needs.changes.outputs.reporting }}
      CI_PACKAGES: ${{ needs.changes.outputs.packages }}
      PACKAGE_NAMES: ${{ needs.changes.outputs.package_names }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Require successful change classification
        run: python scripts/ci.py require
      - name: Report presentation fixtures
        if: needs.changes.outputs.reporting == 'true'
        run: python -m unittest discover -s scripts/performance_report/tests -v
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.compiler == 'true'
        with:
          shared-key: linux-tests
      - name: Install nextest
        if: needs.changes.outputs.compiler == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Rust unit and integration tests
        if: needs.changes.outputs.compiler == 'true'
        run: cargo nextest run --workspace --locked --profile unit
      - name: Doctests
        if: needs.changes.outputs.compiler == 'true'
        run: cargo test --workspace --locked --doc
      - name: Optimized task migration regression
        if: needs.changes.outputs.compiler == 'true'
        run: cargo test --locked --release -p fai-runtime --lib migrated_task_reads_the_resuming_threads_context
      - name: Verify nextest partition
        if: needs.changes.outputs.compiler == 'true'
        run: ./scripts/check-nextest-partition.sh
      - uses: ./.github/actions/compiler
        id: compiler
        if: needs.changes.outputs.mode == 'compiler' || needs.changes.outputs.mode == 'packages'
      - name: Validate locked package workspace
        if: needs.changes.outputs.mode == 'compiler' || needs.changes.outputs.mode == 'packages'
        run: python scripts/ci.py validate-packages
      - name: Native package checks
        if: needs.changes.outputs.packages != '[]'
        run: |
          for package in $PACKAGE_NAMES; do
            fai fmt --check --locked -C packages --package "$package"
            fai check --no-examples --locked -C packages --package "$package"
            fai test --locked -C packages --package "$package" --seed 42 --count 128
          done
      - name: Build launcher for relocation fixture
        if: needs.changes.outputs.compiler == 'true' && needs.changes.outputs.packages != '[]'
        run: cargo build --locked -p fai-installer --bin fai-installer
      - name: Compiler relocation and execution fixtures
        if: needs.changes.outputs.compiler == 'true' && needs.changes.outputs.packages != '[]'
        run: |
          python scripts/tests/smoke_compiler.py --fai '${{ steps.compiler.outputs.binary }}' --launcher target/debug/fai-installer
          python scripts/tests/json_toolchain.py --fai '${{ steps.compiler.outputs.binary }}'
          python scripts/tests/web_toolchain.py --fai '${{ steps.compiler.outputs.binary }}'
      - uses: ./.github/actions/postgres
        if: contains(fromJSON(needs.changes.outputs.packages), 'postgres')
        timeout-minutes: 10
      - uses: ./.github/actions/tui
        if: contains(fromJSON(needs.changes.outputs.packages), 'tui')
        timeout-minutes: 10
      - uses: ./.github/actions/process
        if: contains(fromJSON(needs.changes.outputs.packages), 'process')
        timeout-minutes: 10
      - uses: ./.github/actions/http-client
        if: contains(fromJSON(needs.changes.outputs.packages), 'http-client')
        timeout-minutes: 10
      - uses: ./.github/actions/llm
        if: contains(fromJSON(needs.changes.outputs.packages), 'llm')
        timeout-minutes: 10
      - uses: ./.github/actions/logging
        if: contains(fromJSON(needs.changes.outputs.packages), 'logging')
        timeout-minutes: 10
      - uses: ./.github/actions/regex
        if: contains(fromJSON(needs.changes.outputs.packages), 'regex')
        timeout-minutes: 10
      - name: Package-declared Fai integrations
        if: needs.changes.outputs.packages != '[]'
        run: python scripts/package_integrations.py --ci
      - name: Native filesystem compiler fixture
        if: needs.changes.outputs.compiler == 'true' && needs.changes.outputs.packages != '[]'
        run: python scripts/tests/filesystem_toolchain.py --fai '${{ steps.compiler.outputs.binary }}'
      - name: Package verified compiler bundle
        if: needs.changes.outputs.packages != '[]' && (needs.changes.outputs.compiler == 'true' || steps.compiler.outputs.source == 'build' || github.event_name == 'push')
        run: python scripts/compiler.py pack --offline --no-build --output "$RUNNER_TEMP/compiler.zip"
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.packages != '[]' && (needs.changes.outputs.compiler == 'true' || steps.compiler.outputs.source == 'build' || github.event_name == 'push')
        with:
          name: ${{ steps.compiler.outputs.artifact }}
          path: ${{ runner.temp }}/compiler.zip
          retention-days: 30
          if-no-files-found: error
      - name: Rust test summary
        if: always() && needs.changes.outputs.compiler == 'true'
        run: python scripts/junit-summary.py target/nextest/unit/junit.xml
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.compiler == 'true'
        with:
          name: junit-report-unit
          path: target/nextest/unit/junit.xml
          if-no-files-found: ignore

  cross-os:
    name: platform tests
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SCOPE_RESULT: ${{ needs.changes.result }}
      CI_MODE: ${{ needs.changes.outputs.mode }}
      CI_COMPILER: ${{ needs.changes.outputs.compiler }}
      CI_REPORTING: ${{ needs.changes.outputs.reporting }}
      CI_PACKAGES: ${{ needs.changes.outputs.packages }}
      PACKAGE_NAMES: ${{ needs.changes.outputs.package_names }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Require successful change classification
        run: python scripts/ci.py require
      - name: Report presentation fixtures
        if: needs.changes.outputs.reporting == 'true'
        run: python -m unittest discover -s scripts/performance_report/tests -v
      - name: Set up native Windows linker
        if: runner.os == 'Windows' && (needs.changes.outputs.mode == 'compiler' || needs.changes.outputs.mode == 'packages')
        uses: ilammy/msvc-dev-cmd@v1
      - name: Windows installer archive validation
        if: runner.os == 'Windows' && needs.changes.outputs.compiler == 'true'
        run: python -m unittest discover -s scripts/tests -p test_install_ps1.py -v
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.compiler == 'true'
      - uses: taiki-e/install-action@v2
        if: needs.changes.outputs.compiler == 'true'
        with:
          tool: nextest
      - name: Rust platform tests
        if: needs.changes.outputs.compiler == 'true'
        run: cargo nextest run --workspace --locked --profile cross-os
      - name: Optimized task migration regression
        if: needs.changes.outputs.compiler == 'true'
        run: cargo test --locked --release -p fai-runtime --lib migrated_task_reads_the_resuming_threads_context
      - uses: ./.github/actions/compiler
        id: compiler
        if: needs.changes.outputs.mode == 'compiler' || needs.changes.outputs.mode == 'packages'
      - name: Validate locked package workspace
        if: needs.changes.outputs.mode == 'compiler' || needs.changes.outputs.mode == 'packages'
        run: python scripts/ci.py validate-packages
      - name: Native package checks (macOS)
        if: runner.os != 'Windows' && needs.changes.outputs.packages != '[]'
        run: |
          for package in $PACKAGE_NAMES; do
            fai fmt --check --locked -C packages --package "$package"
            fai check --no-examples --locked -C packages --package "$package"
            fai test --locked -C packages --package "$package" --seed 42 --count 128
          done
      - name: Native package checks (Windows)
        if: runner.os == 'Windows' && needs.changes.outputs.packages != '[]'
        run: |
          foreach ($package in $env:PACKAGE_NAMES.Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)) {
            fai fmt --check --locked -C packages --package $package
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            fai check --no-examples --locked -C packages --package $package
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            fai test --locked -C packages --package $package --seed 42 --count 128
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build launcher for relocation fixture
        if: needs.changes.outputs.compiler == 'true' && needs.changes.outputs.packages != '[]'
        run: cargo build --locked -p fai-installer --bin fai-installer
      - name: Compiler relocation fixture
        if: needs.changes.outputs.compiler == 'true' && needs.changes.outputs.packages != '[]'
        run: python scripts/tests/smoke_compiler.py --fai '${{ steps.compiler.outputs.binary }}' --launcher target/debug/fai-installer
      - name: JSON compiler fixtures
        if: needs.changes.outputs.compiler == 'true' && needs.changes.outputs.packages != '[]'
        run: python scripts/tests/json_toolchain.py --fai '${{ steps.compiler.outputs.binary }}'
      - name: HTTP compiler fixtures
        if: needs.changes.outputs.compiler == 'true' && needs.changes.outputs.packages != '[]'
        run: python scripts/tests/web_toolchain.py --fai '${{ steps.compiler.outputs.binary }}'
      - uses: ./.github/actions/postgres
        if: contains(fromJSON(needs.changes.outputs.packages), 'postgres')
        timeout-minutes: 10
      - uses: ./.github/actions/tui
        if: contains(fromJSON(needs.changes.outputs.packages), 'tui')
        timeout-minutes: 10
      - uses: ./.github/actions/process
        if: contains(fromJSON(needs.changes.outputs.packages), 'process')
        timeout-minutes: 10
      - uses: ./.github/actions/http-client
        if: contains(fromJSON(needs.changes.outputs.packages), 'http-client')
        timeout-minutes: 10
      - uses: ./.github/actions/llm
        if: contains(fromJSON(needs.changes.outputs.packages), 'llm')
        timeout-minutes: 10
      - uses: ./.github/actions/logging
        if: contains(fromJSON(needs.changes.outputs.packages), 'logging')
        timeout-minutes: 10
      - uses: ./.github/actions/regex
        if: contains(fromJSON(needs.changes.outputs.packages), 'regex')
        timeout-minutes: 10
      - name: Package-declared Fai integrations
        if: needs.changes.outputs.packages != '[]'
        run: python scripts/package_integrations.py --ci
      - name: Native filesystem compiler fixture
        if: needs.changes.outputs.compiler == 'true' && needs.changes.outputs.packages != '[]'
        run: python scripts/tests/filesystem_toolchain.py --fai '${{ steps.compiler.outputs.binary }}'
      - name: Package verified compiler bundle
        if: needs.changes.outputs.packages != '[]' && (needs.changes.outputs.compiler == 'true' || steps.compiler.outputs.source == 'build' || github.event_name == 'push')
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path
          subprocess.run([sys.executable, "scripts/compiler.py", "pack", "--offline", "--no-build", "--output", str(Path(os.environ["RUNNER_TEMP"]) / "compiler.zip")], check=True)
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.packages != '[]' && (needs.changes.outputs.compiler == 'true' || steps.compiler.outputs.source == 'build' || github.event_name == 'push')
        with:
          name: ${{ steps.compiler.outputs.artifact }}
          path: ${{ runner.temp }}/compiler.zip
          retention-days: 30
          if-no-files-found: error
      - name: Rust test summary
        if: always() && needs.changes.outputs.compiler == 'true'
        run: python scripts/junit-summary.py target/nextest/cross-os/junit.xml
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.compiler == 'true'
        with:
          name: junit-report-${{ matrix.os }}
          path: target/nextest/cross-os/junit.xml
          if-no-files-found: ignore

  shared-rc-miri:
    name: shared RC (Miri)
    needs: changes
    if: vars.FAI_ENABLE_OPTIONAL_CI == 'true' && needs.changes.outputs.compiler == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-10-08
      MIRIFLAGS: -Zmiri-permissive-provenance
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly-2026-10-08 --profile minimal --component miri,rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shared-rc-miri
      - run: cargo miri setup
      - run: cargo miri test -p fai-runtime --locked --lib shared_rc_tests -- --test-threads=1

  proptest:
    name: property tests (linux)
    needs: changes
    if: vars.FAI_ENABLE_OPTIONAL_CI == 'true' && needs.changes.outputs.compiler == 'true'
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: '4096'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-tests
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace --locked --profile proptest
      - name: Test summary
        if: always()
        run: python scripts/junit-summary.py target/nextest/proptest/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report-proptest
          path: target/nextest/proptest/junit.xml
          if-no-files-found: ignore

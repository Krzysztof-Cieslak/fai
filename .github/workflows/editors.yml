name: Editors

on:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: editors-${{ github.ref }}
  cancel-in-progress: true

# The same checks run automatically through required CI when the extension or
# compiler changes. This workflow retains an independent manual entry point.
jobs:
  vscode:
    name: vscode extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vscode
        timeout-minutes: 10

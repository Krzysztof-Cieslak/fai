name: Editors

on:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: editors-${{ github.ref }}
  cancel-in-progress: true

# The VS Code extension is a self-contained npm package outside the Cargo
# workspace. This optional workflow is disabled in repository settings and kept
# manual-only so automatic CI capacity serves the required Rust checks.
jobs:
  vscode:
    name: vscode extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check-types

      - name: Grammar drift test
        run: npm test

      - name: Package
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: fai-vscode-extension
          path: editors/vscode/fai.vsix
          if-no-files-found: error

[package]
name = "fai-runtime"
description = "The Fai native runtime: tagged values, reference counting, closures, primitives, and capability hosts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

# Built as a static archive (embedded and linked into AOT executables) and as an
# rlib (linked into the compiler so the JIT can resolve runtime symbols by
# address). The runtime's M:N concurrency scheduler needs a few native crates
# (stackful coroutines, work-stealing deques, the IO reactor), so the archive is
# built by a nested `cargo` invocation (see fai-driver/build.rs) rather than a
# single `$RUSTC`; a `staticlib` bundles those dependencies into the one archive.
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
crossbeam-deque.workspace = true
# Cross-platform non-blocking I/O readiness for the network reactor (TCP/UDP).
mio.workspace = true
libc.workspace = true
# TLS engine (sans-I/O) for the `Tls` capability, driven by Fai over `Net`. The
# `ring` provider is a pure-Rust-API crate (its internal asm builds with the C
# toolchain already required to build the compiler); no aws-lc-rs/cmake.
rustls.workspace = true
webpki-roots.workspace = true
rustls-pemfile.workspace = true
libsqlite3-sys.workspace = true
ring.workspace = true
subtle.workspace = true
stringprep.workspace = true
x509-parser.workspace = true
crossterm.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
regex-automata.workspace = true
regex-syntax.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Memory", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Globalization"] }

[target.'cfg(not(windows))'.dependencies]
corosensei.workspace = true

# Exposes the allocator fuzz harness (`run_ops`) for the out-of-workspace
# cargo-fuzz target. Off by default and dependency-free, so the staticlib/rlib and
# the single-`$RUSTC` archive build are unaffected.
[features]
fuzzing = []
allocation-stats = []

# Dev-only; not part of the staticlib/rlib, so the runtime stays dependency-free
# for the single-`$RUSTC` archive build.
[dev-dependencies]
regex.workspace = true
proptest.workspace = true
wait-timeout.workspace = true
# Mint ephemeral self-signed certs for the in-process TLS handshake tests.
rcgen.workspace = true
tempfile.workspace = true

[lints]
workspace = true

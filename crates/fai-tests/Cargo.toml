[package]
name = "fai-tests"
description = "End-to-end tests, golden snapshots, and the incremental verifier."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true

[features]
allocation-stats = ["fai-driver/allocation-stats", "fai-codegen/allocation-stats", "fai-runtime/allocation-stats"]

# The library target carries the reusable incremental-verifier harness; the
# golden/e2e tests live under `tests/`.
[dependencies]
fai-bench-workloads.workspace = true
fai-span.workspace = true
fai-db.workspace = true
fai-diagnostics.workspace = true
fai-resolve.workspace = true
fai-syntax.workspace = true
fai-types.workspace = true
camino.workspace = true
wait-timeout.workspace = true
serde_json.workspace = true
serde.workspace = true
blake3.workspace = true
tempfile.workspace = true
object.workspace = true

[dev-dependencies]
fai-cli.workspace = true
fai-corpus.workspace = true
fai-driver.workspace = true
fai-server.workspace = true
fai-lsp.workspace = true
fai-fmt.workspace = true
fai-ide.workspace = true
fai-core.workspace = true
fai-rc.workspace = true
fai-codegen.workspace = true
fai-runtime.workspace = true
fai-contracts.workspace = true
indoc.workspace = true
insta.workspace = true
proptest.workspace = true
rcgen.workspace = true
rustls.workspace = true
divan.workspace = true
rayon.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true


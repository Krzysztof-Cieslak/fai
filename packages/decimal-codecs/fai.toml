manifest-version = 1

[package]
name = "decimal-codecs"
version = "0.1.0"
fai-version = "0.0.1 || ^0.1.0"
test-dir = "test"

[dependencies]
decimal = { git = "https://github.com/Krzysztof-Cieslak/fai.git", subdir = "packages/decimal", version = "^0.1.0" }
json = { git = "https://github.com/Krzysztof-Cieslak/fai.git", subdir = "packages/json", version = "^0.1.0" }
yaml = { git = "https://github.com/Krzysztof-Cieslak/fai.git", subdir = "packages/yaml", version = "^0.1.0" }
sql = { git = "https://github.com/Krzysztof-Cieslak/fai.git", subdir = "packages/sql", version = "^0.1.0" }

[[bin]]
name = "runtime-checks"
path = "examples/RuntimeChecks.fai"

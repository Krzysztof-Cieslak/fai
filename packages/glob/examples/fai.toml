manifest-version = 1

[package]
name = "glob-examples"
version = "0.1.0"
fai-version = "^0.1.0"
source-dir = "."
auto-main = false

[dependencies]
glob = { git = "https://github.com/Krzysztof-Cieslak/fai.git", subdir = "packages/glob", version = "^0.1.0" }
process = { git = "https://github.com/Krzysztof-Cieslak/fai.git", subdir = "packages/process", version = "^0.1.0" }

[[bin]]
name = "runtime-checks"
path = "RuntimeChecks.fai"

[[bin]]
name = "git-checks"
path = "GitChecks.fai"
